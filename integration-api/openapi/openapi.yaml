                  meta: { $ref: "#/components/schemas/RequestMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Register an HTTPS endpoint; secret is returned once
      x-required-scopes: [webhooks:manage]
      requestBody:
        required: true
        content:
          application/json:

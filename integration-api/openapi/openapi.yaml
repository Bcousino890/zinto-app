        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ContactFields:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        email: { type: [string, "null"], format: email }
        phone: { type: [string, "null"] }
        avatar_url: { type: [string, "null"], format: uri }
        company: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        source: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        custom_fields: { type: object, additionalProperties: true }
    ContactCreate:
      allOf:
        - $ref: "#/components/schemas/ContactFields"
        - type: object
          required: [name]
          additionalProperties: false
    ContactUpdate:
      allOf:
        - $ref: "#/components/schemas/ContactFields"
        - type: object
          minProperties: 1
          additionalProperties: false
    Contact:
      allOf:
        - $ref: "#/components/schemas/ContactFields"
        - type: object
          required: [id, name, tags, custom_fields, archived, created_at, updated_at]
          properties:
            id: { type: string }
            archived: { type: boolean }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ContactResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Contact" }
        meta: { $ref: "#/components/schemas/RequestMeta" }
    Pipeline:
      type: object
      required: [id, name, is_default, is_template, order_num, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: [string, "null"] }
        icon: { type: [string, "null"] }
        color: { type: [string, "null"] }
        is_default: { type: boolean }
        is_template: { type: boolean }
        template_category: { type: [string, "null"] }
        order_num: { type: integer }
        created_by_user_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PipelineStage:
      type: object
      required: [id, pipeline_id, name, color, order_num, created_at, updated_at]
      properties:
        id: { type: string }
        pipeline_id: { type: string }
        name: { type: string }
        color: { type: string }
        order_num: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Deal:
      type: object
      required: [id, pipeline_id, contact_id, title, stage_key, tags, custom_fields, created_at, updated_at]
      properties:
        id: { type: string }
        pipeline_id: { type: string }
        contact_id: { type: string }
        title: { type: string }
        stage_key:
          type: string
          description: Legacy stage vocabulary stored on the deal itself.
        stage_id:
          type: [string, "null"]
          description: Configurable pipeline stage; a different vocabulary from stage_key.
        stage_name:
          type: [string, "null"]
          description: Null when the stage reference does not resolve inside the same pipeline and company.
        value: { type: [integer, "null"] }
        priority: { type: [string, "null"] }
        status: { type: [string, "null"] }
        due_date: { type: [string, "null"], format: date-time }
        assigned_to_user_id: { type: [string, "null"] }
        description: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        custom_fields: { type: object, additionalProperties: true }
        last_activity_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DealStageInput:
      type: object
      required: [stage_id]
      additionalProperties: false
      properties:
        stage_id:
          type: string
          pattern: '^\d+$'
          description: Stage of the same pipeline the deal already belongs to.
    DealCreate:
      type: object
      required: [contact_id, pipeline_id, stage_id, title]
      additionalProperties: false
      properties:
        contact_id: { type: string, pattern: '^\d+$' }
        pipeline_id: { type: string, pattern: '^\d+$' }
        stage_id: { type: string, pattern: '^\d+$' }
        title: { type: string, minLength: 1, maxLength: 255 }
        value: { type: [integer, "null"] }
        priority: { type: [string, "null"], maxLength: 50 }
        status: { type: [string, "null"], maxLength: 50 }
        due_date: { type: [string, "null"], format: date-time }
        assigned_to_user_id: { type: [string, "null"], pattern: '^\d+$' }
        description: { type: [string, "null"], maxLength: 20000 }
        tags: { type: array, maxItems: 100, items: { type: string, maxLength: 100 } }
        custom_fields: { type: object, additionalProperties: true }
    DealUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        stage_id: { type: string, pattern: '^\d+$' }
        value: { type: [integer, "null"] }
        priority: { type: [string, "null"], maxLength: 50 }
        status: { type: [string, "null"], maxLength: 50 }
        due_date: { type: [string, "null"], format: date-time }
        assigned_to_user_id: { type: [string, "null"], pattern: '^\d+$' }
        description: { type: [string, "null"], maxLength: 20000 }
        tags: { type: array, maxItems: 100, items: { type: string, maxLength: 100 } }
        custom_fields: { type: object, additionalProperties: true }
    DealMove:
      type: object
      required: [pipeline_id, stage_id]
      additionalProperties: false
      properties:
        pipeline_id: { type: string, pattern: '^\d+$' }
        stage_id: { type: string, pattern: '^\d+$' }
    Task:
      type: object
      required: [id, contact_id, title, priority, status, tags, created_at, updated_at]
      properties:
        id: { type: string }
        contact_id: { type: string }
        title: { type: string }
        description: { type: [string, "null"] }
        priority: { type: string }
        status: { type: string }
        due_date: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        assigned_to:
          type: [string, "null"]
          description: Free text in the schema; it is not a validated user reference.
        category: { type: [string, "null"] }
        tags: { type: array, items: { type: string } }
        background_color: { type: [string, "null"] }
        created_by_user_id: { type: [string, "null"] }
        updated_by_user_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TaskCreate:
      type: object
      required: [contact_id, title]
      additionalProperties: false
      properties:
        contact_id: { type: string, pattern: '^\d+$' }
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 20000 }
        priority: { type: string, maxLength: 50 }
        status: { type: string, maxLength: 50 }
        due_date: { type: [string, "null"], format: date-time }
        assigned_to: { type: [string, "null"], maxLength: 500 }
        category: { type: [string, "null"], maxLength: 500 }
        tags: { type: array, maxItems: 100, items: { type: string, maxLength: 100 } }
        background_color: { type: [string, "null"], maxLength: 50 }
    TaskUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: [string, "null"], maxLength: 20000 }
        priority: { type: string, maxLength: 50 }
        status: { type: string, maxLength: 50 }
        due_date: { type: [string, "null"], format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        assigned_to: { type: [string, "null"], maxLength: 500 }
        category: { type: [string, "null"], maxLength: 500 }
        tags: { type: array, maxItems: 100, items: { type: string, maxLength: 100 } }
        background_color: { type: [string, "null"], maxLength: 50 }
    NoteInput:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content: { type: string, minLength: 1, maxLength: 20000 }
    Note:
      type: object
      required: [id, contact_id, created_by_id, content, created_at, updated_at]
      properties:
        id: { type: string }
        contact_id: { type: string }
        created_by_id: { type: string }
        content: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    NoteResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Note" }
        meta: { $ref: "#/components/schemas/RequestMeta" }
    ConversationCreate:
      type: object
      required: [contact_id, channel_id]
      additionalProperties: false
      properties:
        contact_id: { type: string, pattern: "^\\d+$" }
        channel_id: { type: string, pattern: "^\\d+$" }
    ConversationResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/Conversation" }
        meta: { $ref: "#/components/schemas/RequestMeta" }
    Conversation:
      type: object
      properties:
        id: { type: string }
        contact_id: { type: [string, "null"] }
        channel_id: { type: string }
        channel_type: { type: string }
        status: { type: string }
        assigned_to_user_id: { type: [string, "null"] }
        last_message_at: { type: [string, "null"], format: date-time }
        unread_count: { type: integer }
        bot_disabled: { type: boolean }
        archived: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        external_id: { type: [string, "null"] }
        direction: { type: string, enum: [incoming, outgoing] }
        type: { type: string }
        content: { type: string }
        status: { type: string }
        sender_id: { type: [string, "null"] }
        sender_type: { type: [string, "null"] }
        from_bot: { type: boolean }
        media_url: { type: [string, "null"] }
        sent_at: { type: [string, "null"], format: date-time }
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    TextMessageInput:
      type: object
      required: [channel_id, to, message]
      additionalProperties: false
      properties:
        channel_id: { type: string, pattern: '^\d+$' }
        to: { type: string, minLength: 1, maxLength: 320 }
        message: { type: string, minLength: 1, maxLength: 4096 }
    MediaMessageInput:
      type: object
      required: [channel_id, to, media_type, media_url]
      additionalProperties: false
      properties:
        channel_id: { type: string, pattern: '^\d+$' }
        to: { type: string, minLength: 1, maxLength: 320 }
        media_type: { type: string, enum: [image, video, audio, document] }
        media_url: { type: string, format: uri, maxLength: 2048, description: Public HTTP(S) URL; private addresses are rejected }
        caption: { type: string, maxLength: 1024 }
        filename: { type: string, maxLength: 255 }
    TemplateMessageInput:
      type: object
      required: [channel_id, to, template_name]
      additionalProperties: false
      properties:
        channel_id: { type: string, pattern: '^\d+$' }
        to: { type: string, minLength: 1, maxLength: 320 }
        template_name: { type: string }
        template_language: { type: string, default: en }
        components: { type: array, items: {} }
    InteractiveMessageInput:
      type: object
      required: [channel_id, to, interactive_type, body, action]
      additionalProperties: false
      properties:
        channel_id: { type: string, pattern: '^\d+$' }
        to: { type: string, minLength: 1, maxLength: 320 }
        interactive_type: { type: string, enum: [button, list] }
        body: { type: string, minLength: 1, maxLength: 1024 }
        header: { type: string, maxLength: 60 }
        footer: { type: string, maxLength: 60 }
        action: { type: object, additionalProperties: true }
    MessageDelivery:
      type: object
      properties:
        id: { type: string }
        external_id: { type: [string, "null"] }
        status: { type: string }
        timestamp: { type: string, format: date-time }
        channel_type: { type: string }
        conversation_id: { type: string }
    MessageDeliveryResponse:
      type: object
      properties:
        data: { $ref: "#/components/schemas/MessageDelivery" }
        meta: { $ref: "#/components/schemas/RequestMeta" }
    WebhookCreate:
      type: object
      required: [url, event_types]
      additionalProperties: false
      properties:
        url: { type: string, format: uri, description: Public HTTPS endpoint }
        event_types:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: "#/components/schemas/WebhookEventType" }
    WebhookEndpoint:
      type: object
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        event_types: { type: array, items: { $ref: "#/components/schemas/WebhookEventType" } }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
    WebhookEventType:
      type: string
      description: |
        Accepted subscription event emitted by the installed outbox migration.
        The corresponding source table must exist for optional ERP and Flow
        families to install their guarded triggers.
      enum:
        - contact.created
        - contact.updated
        - contact.deleted
        - conversation.created
        - conversation.updated
        - message.created
        - message.status.updated
        - note.created
        - note.updated
        - note.deleted
        - tag.attached
        - tag.detached
        - deal.created
        - deal.updated
        - deal.stage.changed
        - deal.deleted
        - pipeline.created
        - pipeline.updated
        - pipeline.deleted
        - pipeline.stage.created
        - pipeline.stage.updated
        - pipeline.stage.deleted
        - task.created
        - task.updated
        - task.completed
        - task.deleted
        - channel.connection.updated
        - erp.product.created
        - erp.product.updated
        - erp.product.deleted
        - erp.stock_level.created
        - erp.stock_level.updated
        - erp.stock_level.deleted
        - erp.stock_movement.created
        - erp.stock_movement.updated
        - erp.stock_movement.deleted
        - erp.stock_transfer.created
        - erp.stock_transfer.updated
        - erp.stock_transfer.deleted
        - erp.sales_order.created
        - erp.sales_order.updated
        - erp.sales_order.deleted
        - erp.supplier.created
        - erp.supplier.updated
        - erp.supplier.deleted
        - erp.purchase_order.created
        - erp.purchase_order.updated
        - erp.purchase_order.deleted
        - erp.invoice.created
        - erp.invoice.updated
        - erp.invoice.deleted
        - erp.invoice_payment.created
        - erp.invoice_payment.updated
        - erp.invoice_payment.deleted
        - flow.created
        - flow.updated
        - flow.deleted
        - flow.execution.started
        - flow.execution.updated
        - flow.execution.completed
        - flow.execution.failed
    WebhookEvent:
      type: object
      required: [id, type, schema_version, occurred_at, data]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/WebhookEventType" }
        schema_version: { type: integer, minimum: 1 }
        occurred_at: { type: string, format: date-time }
        data: {}

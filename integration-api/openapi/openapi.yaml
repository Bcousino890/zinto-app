openapi: 3.1.0
info:
  title: Zinto Integration API
  version: 0.1.0
  summary: Bidirectional, tenant-safe API for Zinto partners
  description: |
    Integrate external systems with Zinto contacts, conversations, complete
    message history, channel delivery, notes, tags, and signed webhooks.
    Tenant identity always comes from the API key; clients never send company_id.
  x-api-base-url: https://crm.zinto.app/_integration-api/api/v1
servers:
  - url: https://crm.zinto.app/_integration-api
    description: Controlled preview on the Zinto VPS
tags:
  - name: System
  - name: Identity
  - name: Channels
  - name: Contacts
  - name: Conversations
  - name: Messages
  - name: Flows
  - name: ERP
  - name: Webhooks
  - name: Flows
  - name: ERP
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      summary: Check service liveness
      x-required-scopes: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /ready:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      summary: Check service dependencies
      x-required-scopes: []
      responses:
        "200":
          description: Service and database are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: A required service is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/me:
    get:
      tags: [Identity]
      operationId: getApiIdentity
      summary: Inspect the authenticated company and scopes
      x-required-scopes: []
      responses:
        "200":
          description: Authenticated identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/channels:
    get:
      tags: [Channels]
      operationId: listChannels
      summary: List company channels and supported capabilities
      x-required-scopes: [channels:read]
      responses:
        "200":
          description: Company channel list without provider credentials
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Channel" }
                  meta: { $ref: "#/components/schemas/RequestMeta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/erp/products:
    get:
      tags: [ERP]
      operationId: listErpProducts
      summary: List company products
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated products }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/erp/inventory/warehouses:
    get:
      tags: [ERP]
      operationId: listErpWarehouses
      summary: List company warehouses
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated warehouses }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/erp/inventory/stock-levels:
    get:
      tags: [ERP]
      operationId: listErpStockLevels
      summary: List company stock levels
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated stock levels }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/erp/suppliers:
    get:
      tags: [ERP]
      operationId: listErpSuppliers
      summary: List company suppliers
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated suppliers }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/erp/sales-orders:
    get:
      tags: [ERP]
      operationId: listErpSalesOrders
      summary: List company sales orders
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated sales orders }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/erp/purchase-orders:
    get:
      tags: [ERP]
      operationId: listErpPurchaseOrders
      summary: List company purchase orders
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated purchase orders }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/erp/invoices:
    get:
      tags: [ERP]
      operationId: listErpInvoices
      summary: List company invoices
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: Paginated invoices }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /api/v1/flows:
    get:
      tags: [Flows]
      operationId: listFlows
      summary: List company flows
      description: Requires `flows:read`; results are restricted to the API-key company.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200": { description: Flow page, content: { application/json: { schema: { $ref: "#/components/schemas/PageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/flows/{id}:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Flows]
      operationId: getFlow
      summary: Get a company flow
      responses:
        "200": { description: Flow, content: { application/json: { schema: { $ref: "#/components/schemas/Flow" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/flows/{id}/sessions:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Flows]
      operationId: listFlowSessions
      summary: List sessions for a company flow
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Session page, content: { application/json: { schema: { $ref: "#/components/schemas/PageResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/flows/{id}/executions:
    parameters: [{ $ref: "#/components/parameters/ResourceId" }]
    get:
      tags: [Flows]
      operationId: listFlowExecutions
      summary: List executions for a company flow
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Execution page, content: { application/json: { schema: { $ref: "#/components/schemas/PageResponse" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/flow-templates:
    get:
      tags: [Flows]
      operationId: listFlowTemplates
      summary: List active global flow templates
      description: The source schema defines templates as a global catalog, not company-private data.
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200": { description: Template page, content: { application/json: { schema: { $ref: "#/components/schemas/PageResponse" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/contacts:
    get:
      tags: [Contacts]
      operationId: listContacts
      summary: List contacts with cursor pagination
      x-required-scopes: [contacts:read]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/UpdatedSince"
      responses:
        "200":
          description: Contact page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Contact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Contacts]
      operationId: createContact
      summary: Create a contact
      x-required-scopes: [contacts:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactCreate" }
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
  /api/v1/contacts/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Contacts]
      operationId: getContact
      summary: Fetch one contact owned by the company
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Contacts]
      operationId: updateContact
      summary: Update allowed contact fields
      x-required-scopes: [contacts:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactUpdate" }
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
    delete:
      tags: [Contacts]
      operationId: archiveContact
      summary: Archive a contact
      x-required-scopes: [contacts:write]
      responses:
        "200":
          description: Contact archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
  /api/v1/contacts/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Contacts]
      operationId: listContactNotes
      summary: List notes for a contact with cursor pagination
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/UpdatedSince"
      responses:
        "200":
          description: Note page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Note" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Contacts]
      operationId: createContactNote
      summary: Add a historical note to a contact
      x-required-scopes: [notes:write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
  /api/v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [Contacts]
      operationId: updateContactNote
      summary: Update a note
      x-required-scopes: [notes:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NoteInput" }
      responses:
        "200":
          description: Note updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NoteResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
    delete:
      tags: [Contacts]
      operationId: deleteContactNote
      summary: Delete a note
      x-required-scopes: [notes:write]
      responses:
        "204": { description: Note deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
  /api/v1/contacts/{id}/tags/{tag}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: tag
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 100 }
    put:
      tags: [Contacts]
      operationId: attachContactTag
      summary: Attach a tag idempotently
      x-required-scopes: [tags:write]
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
    delete:
      tags: [Contacts]
      operationId: detachContactTag
      summary: Detach a tag idempotently
      x-required-scopes: [tags:write]
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ReadOnlyMode" }
  /api/v1/pipelines:
    post:
      tags: [Pipelines]
      operationId: createPipeline
      summary: Create a pipeline
      description: Requires `pipelines:write` and an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 500 }
                icon: { type: [string, "null"], maxLength: 500 }
                color: { type: [string, "null"], maxLength: 50 }
                is_default: { type: boolean }
                is_template: { type: boolean }
                template_category: { type: [string, "null"], maxLength: 500 }
                order_num: { type: integer, minimum: 0 }
      responses:
        "201": { description: Pipeline created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    get:
      tags: [Pipelines]
      operationId: listPipelines
      x-required-scopes: [pipelines:read]
      summary: List the pipelines of the authenticated company
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/UpdatedSince"
      responses:
        "200":
          description: Pipeline page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Pipeline" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/pipelines/{id}/stages:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Pipelines]
      operationId: listPipelineStages
      x-required-scopes: [pipelines:read]
      summary: List the stages of a pipeline owned by the company
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/UpdatedSince"
      responses:
        "200":
          description: Pipeline stage page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PageResponse"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PipelineStage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Pipelines]
      operationId: createPipelineStage
      summary: Create a pipeline stage
      description: Requires `pipelines:write` and an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, color]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                color: { type: string, minLength: 1, maxLength: 50 }
                order_num: { type: integer, minimum: 0 }
      responses:
        "201": { description: Pipeline stage created }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/pipelines/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    patch:
      tags: [Pipelines]
      operationId: updatePipeline
      summary: Update a pipeline
      description: Requires `pipelines:write` and an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                description: { type: [string, "null"], maxLength: 500 }
                icon: { type: [string, "null"], maxLength: 500 }
                color: { type: [string, "null"], maxLength: 50 }
                is_default: { type: boolean }
                is_template: { type: boolean }
                template_category: { type: [string, "null"], maxLength: 500 }
                order_num: { type: integer, minimum: 0 }
      responses:
        "200": { description: Pipeline updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Pipelines]
      operationId: deletePipeline
      summary: Delete an unused pipeline
      description: Requires `pipelines:write` and an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Pipeline deleted }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/v1/pipelines/{id}/stages/{stageId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: stageId
        in: path
        required: true
        schema: { type: string, pattern: '^\d+$' }
    patch:
      tags: [Pipelines]
      operationId: updatePipelineStage
      summary: Update a pipeline stage
      description: Requires `pipelines:write` and an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 255 }
                color: { type: string, minLength: 1, maxLength: 50 }
                order_num: { type: integer, minimum: 0 }
      responses:
        "200": { description: Pipeline stage updated }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    delete:
      tags: [Pipelines]
      operationId: deletePipelineStage
      summary: Delete an unused pipeline stage
      description: Requires `pipelines:write` and an `Idempotency-Key`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200": { description: Pipeline stage deleted }
        "400": { $ref: "#/components/responses/BadRequest" }

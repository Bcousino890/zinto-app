services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-powerchat}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-powerchat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-powerchat} -d ${DB_NAME:-powerchat}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.simple
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_PORT: 9000
      DATABASE_URL: postgresql://${DB_USER:-powerchat}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-powerchat}
      PGSSLMODE: disable
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      BASE_URL: ${BASE_URL:-http://localhost:9000}
      COMPANY_NAME: ${COMPANY_NAME:-Zinto}
      DOCKER_CONTAINER: "true"
    ports:
      - "${APP_PORT:-9000}:9000"
    volumes:
      - uploads:/app/uploads
      - whatsapp_sessions:/app/whatsapp-sessions
      - app_data:/app/data
      - ./migrations:/app/migrations:ro
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
  whatsapp_sessions:
  app_data:
